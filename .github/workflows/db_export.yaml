name: Database Export

on:
  workflow_dispatch: # Add a run button on GitHub
  schedule:
        - cron: '2 1 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --name postgres-container

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Run Pipeline
        env:
          HDX_SITE: ${{ vars.HDX_SITE }}
          HDX_KEY: ${{ secrets.HDX_BOT_SCRAPERS_API_TOKEN }}
          PREPREFIX: ${{ vars.HDX_USER_AGENT_PREPREFIX }}
          USER_AGENT: ${{ vars.USER_AGENT }}
          BASIC_AUTHS: ${{ secrets.BASIC_AUTHS }}
          ERR_TO_HDX: ${{ secrets.ERR_TO_HDX }}
        run: uv run python -m hapi.pipelines.app -db "postgresql+psycopg://postgres:postgres@localhost:5432/hapi"

      - name: Dump PostgreSQL Views
        run: |
          ./dump_views.sh

      - name: Commit updated DB export
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: db-export
          folder: database
          target-folder: database

      - name: Archive warnings and errors
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: warnings-errors
          path: warnings_errors.log

      - name: Send slack message
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"Build failed! Check the run details: https://github.com/OCHA-DAP/hapi-pipelines-prod/actions/runs/${{ github.run_id }}\"}" \
          ${{ secrets.SLACK_WEBHOOK_URL }}
